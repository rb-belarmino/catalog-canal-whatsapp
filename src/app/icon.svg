<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F7EEDD"/>
      <stop offset="65%" stop-color="#D9BA88"/>
      <stop offset="100%" stop-color="#B89762"/>
    </linearGradient>
  </defs>

  <!-- Luxury dark rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#3F3F46" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Atelier Hook -->
  <path d="M 32 23 C 32 18.5 36.5 15.5 36.5 12 C 36.5 9.5 34.5 7.5 32 7.5 C 29.5 7.5 27.5 9.5 27.5 12" 
