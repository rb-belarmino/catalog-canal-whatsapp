  <!-- Haute Couture Hanger Contour -->
  <path d="M 13 37 L 32 25 L 51 37 C 52.8 38.1 53 40.4 51.6 41.5 C 50.6 42.2 49.3 42 48.2 41.3 L 32 31.2 L 15.8 41.3 C 14.7 42 13.4 42.2 12.4 41.5 C 11 40.4 11.2 38.1 13 37 Z" 
